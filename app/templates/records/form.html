{% extends "base.html" %}

{% block content %}
<section class="panel">
    <p class="page-eyebrow">Medico</p>
    <h1>Nuevo historial</h1>
    <p>Registra diagnostico, tratamiento y notas de la consulta.</p>
    <form method="post" action="{{ url_for('records.create_record_view') }}" class="form-card">
        <div class="form-grid">
            <label>Documento paciente<input name="patient_document" placeholder="CC del paciente" required></label>
            <label>Medico<input value="{{ current_user.full_name if current_user else '' }}" disabled></label>
        </div>
        <label>Diagnostico<textarea name="diagnosis" required></textarea></label>
        <label>Tratamiento<textarea name="treatment" required></textarea></label>
        <label>Notas<textarea name="notes"></textarea></label>
        <div class="form-actions">
            <button type="submit">
                <span class="material-symbols-outlined">save</span>
                Guardar historial
            </button>
        </div>
    </form>
</section>
{% endblock %}
