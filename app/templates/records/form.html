{% extends "base.html" %}

{% block content %}
<section class="panel">
    <h1>Nuevo historial</h1>
    <form method="post" action="{{ url_for('records.create_record_view') }}" class="form">
        <label>Paciente
            <select name="patient_id" required>
                {% for patient in patients %}
                    <option value="{{ patient.id }}">{{ patient.full_name }}</option>
                {% endfor %}
            </select>
        </label>
        <label>Medico
            <select name="doctor_id" required>
                {% for doctor in doctors %}
                    <option value="{{ doctor.id }}" {% if current_user and current_user.id == doctor.id %}selected{% endif %}>{{ doctor.full_name }}</option>
                {% endfor %}
            </select>
        </label>
        <label>Diagnostico<textarea name="diagnosis" required></textarea></label>
        <label>Tratamiento<textarea name="treatment" required></textarea></label>
        <label>Notas<textarea name="notes"></textarea></label>
        <button type="submit">Guardar historial</button>
    </form>
</section>
{% endblock %}
