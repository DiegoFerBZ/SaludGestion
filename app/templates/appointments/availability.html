{% extends "base.html" %}

{% block content %}
<section class="page-title">
    <div>
        <h1>Disponibilidad</h1>
        <p>Bloques de 20 minutos por medico, excluyendo almuerzo de 12:00 a 14:00.</p>
    </div>
</section>

<form method="get" class="search">
    <select name="doctor_id">
        {% for doctor in doctors %}
            <option value="{{ doctor.id }}" {% if selected_doctor == doctor.id %}selected{% endif %}>{{ doctor.full_name }}</option>
        {% endfor %}
    </select>
    <input type="date" name="date" value="{{ selected_date }}">
    <button type="submit">Ver</button>
</form>

{% if availability %}
<section class="slots">
    {% for slot in availability.slots %}
        <span class="slot {{ 'available' if slot.available else 'busy' }}">
            {{ slot.starts_at[11:16] }}
        </span>
    {% endfor %}
</section>
{% endif %}
{% endblock %}
